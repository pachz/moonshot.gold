  ts_ios_cannot_connect_not_connected_so_far_title: |
    در اغلب موارد دلیل متصل نشدن اکانت شما، اشکال در وارد کردن مقادیر کانفیگ هست.

    موارد زیر رو چک کنید:

    ۱. وارد اپلیکیشن Npv Tunnel بشید و در تب Home وی پی ان رو در حالت خاموش قرار بدید
    ۲. در تب Configs وارد بخش ویرایش کانفیگ بشید (برای اینکار روی دکمه قلم کاغذ کنار کانفیگ بزنید)
    ۳. مطمئن بشید که مقدار هاست (SSH Host) فاقد http:// و دقیقا عین مقدار هاست در کانفیگی که دریافت کردید باشه. 
    ۴. ممکنه هنگام ورود مقدار هاست، سهوا فاصله (Space) تایپ کرده باشید، فاصله‌ها رو حذف کنید
    ۵. مطمئن بشید که مقدار Username رو صحیح وارد کردید
    ۶. از صحت فیلدهای دیگه مثل پورت و پسورد اطمینان حاصل کنید
    ۷. تنظیمات رو ذخیر کنید و کانکت رو بزنید

    اگه مشکل حل نشد، اطمینان حاصل کنید که ارتباط شما با اینترنت برقرار و مناسب است برای اینکار می‌تونید مراحل قسمت <b>سنجش کیفیت اینترنت</b> رو انجام بدید.
    در نهایت اگه همه‌ی موارد رو انجام دادید و هنوز نمی‌تونید متصل بشید،‌ از کانفیگتون اسکرین‌شات بگیرید و به آی‌دی پشتیبانی:

    [[support_telegram_id]]

    پیام بدید.
