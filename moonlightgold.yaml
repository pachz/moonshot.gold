    مطمئن باشید که حداقل ۵ گیگابایت فضای خالی روی حافظه دستگاهتون دارید. برای اینکار وارد تنظیمات آي آو اس (Settings) بشید،
    گزینه General رو انتخاب کنید
    سپس روی About بزنید.
    در این قسمت میتونید ظرفیت دستگاه و میزان حافظه‌ی آزاد رو ببینید. مطمئن بشید که مقدار Available حداقل ۵ گیگابایت باشه.

    اگه حافظه دستگاهتون پُره، پیشنهاد می‌کنیم ویدیو، عکس و اپلیکیشن‌های غیر ضروری رو از روی دستگاهتون حذف کنید.
