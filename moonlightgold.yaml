    ۳. اگه هیچکدوم از این موارد مشکلتون رو حل نکرد، <b>سنجش کیفیت اینترنت پایه</b> رو انتخاب کنید
    ۴. در نهایت، اگه مشکل حل نشد، با آی‌دی 

