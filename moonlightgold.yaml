  tsbw_title: |
    برای سرعت بالا و پایداری خوبِ سرویسِ وی پی ان، باید اتصال شما (بدون وی پی ان) با اینترنت مناسب و خوب باشه.
    
    ۱. اگر از طریق دیتا متصل هستید، مطمئن بشید که بسته اینترنت فعال دارید
    ۲. اگه فیلترشکنی روشن هست، اون رو خاموش کنید و مرورگرتون رو باز کنید
    ۳. وارد سایت fast.com بشید
    ۴. کمی صبر کنید تا ارزیابی اولیه کامل بشه
    ۵. روی دکمه show more info بزنید و مجدد صبر کنید
    ۶. اگر با پیغام خطا (معمولا نوشته با رنگ قرمز) نمایش داده شد، یعنی اتصال شما به اینترنت با اختلال زیاد همراه هست.
    ۷. در نهایت عدد اصلی که به شما نشون میده، پهنای باند دریافت شما هست. اگر این مقدار کمتر از ۱۰ مگابیت هست توصیه می‌کنیم که سیگنال اینترنت خودتون رو چک کنید. اگر از اینترنت خانگی استفاده می‌کنید، یکبار مودم یا روتر رو Restart کنید
    ۸. اگه پهنای باند اتصال شما مناسب هست و مشکلی در اتصال وی پی ان دارید، از همین صفحه اسکرین‌شایت بگیرید و برای آی‌دی پشتیبانی

